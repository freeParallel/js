<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>maquina.js — JavaScript scratchpad by maquina.Earth</title>
  <meta name="description" content="maquina.js: a live JavaScript scratchpad. Type code, see results line by line.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23F4A156' stroke-width='2.5'/%3E%3Cpath d='M6 16h20M16 6v20' stroke='%23F4A156' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23F4A156'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" title="maquina.js">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="12" fill="none" stroke="currentColor" stroke-width="2.4"/>
        <path d="M4 16h24M16 4v24" stroke="currentColor" stroke-width="1.4" opacity=".55"/>
        <circle cx="16" cy="16" r="3.6" fill="currentColor"/>
      </svg>
      <span class="wordmark">maquina<b>.js</b></span>
    </a>
    <span class="tagline">type code · see it run · line by line</span>
    <a class="home" href="/">&larr; maquina.Earth</a>
  </header>

  <main class="workspace" id="playground">
    <div class="toolbar">
      <button id="runBtn" class="btn primary" title="Run (Ctrl+Enter)">
        <svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg><span>Run</span>
      </button>
      <button id="stopBtn" class="btn" title="Stop">
        <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor"/></svg><span>Stop</span>
      </button>
      <span class="sep"></span>
      <button id="clearBtn" class="btn" title="Clear output">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg><span>Clear</span>
      </button>
      <button id="shareBtn" class="btn" title="Copy share link (Ctrl+S)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><span>Share</span>
      </button>
      <span class="grow"></span>
      <span class="pane-label">output</span>
      <button id="settingsBtn" class="btn icon" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
      <button id="fullscreenBtn" class="btn icon" title="Focus mode (Esc to exit)" aria-label="Focus mode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>

    <div class="panes">
      <div class="editor-pane" id="editorPane"></div>
      <div class="divider" id="divider" title="Drag to resize · double-click to reset"></div>
      <div class="output-pane" id="outputPane">
        <div class="output" id="output"></div>
      </div>
    </div>

    <footer class="statusbar" id="statusbar">
      <span class="dot" id="dot"></span>
      <span id="status">ready</span>
      <span class="grow"></span>
      <span id="cursorPos">Ln 1, Col 1</span>
      <span class="hint">Ctrl+Enter run · Ctrl+/ comment · Ctrl+S share</span>
    </footer>

    <form class="settings" id="settings" hidden>
      <h3>settings</h3>
      <label>Run while typing <input type="checkbox" name="autoRun"></label>
      <label>Show expression results <input type="checkbox" name="showExpr"></label>
      <label>Line numbers <input type="checkbox" name="lineNumbers"></label>
      <label>Font size <input type="number" name="fontSize" min="10" max="28"></label>
      <label>Timeout (s) <input type="number" name="timeout" min="1" max="60"></label>
      <button type="button" id="resetBtn" class="link">Load example code</button>
    </form>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/comment/comment.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/acorn@8.12.1/dist/acorn.js"></script>
  <script src="app.js"></script>
  <!-- Cloudflare Web Analytics -->
  <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"8ab345c48040403c9d8c565fef2612bb"}'></script>
  <!-- End Cloudflare Web Analytics -->
</body>
</html>
